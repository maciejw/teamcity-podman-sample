services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Compose_Test!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 5 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P 'Compose_Test!2026' -Q 'SELECT 1;' >/dev/null
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 20s

  kafka:
    image: docker.io/apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 5 /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 20s
