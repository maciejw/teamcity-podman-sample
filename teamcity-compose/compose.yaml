name: teamcity

services:
  server-data-init:
    image: ${CONTAINER_REGISTRY:-docker.io}/jetbrains/teamcity-server:2026.1.3-linux
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "/bootstrap/init-server-data.sh"]
    volumes:
      - server-data:/data/teamcity_server/datadir
      - ./server-bootstrap/init-server-data.sh:/bootstrap/init-server-data.sh:ro

  server:
    image: ${CONTAINER_REGISTRY:-docker.io}/jetbrains/teamcity-server:2026.1.3-linux
    container_name: teamcity-server
    restart: unless-stopped
    depends_on:
      server-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8111:8111"
    volumes:
      - server-data:/data/teamcity_server/datadir
      - server-logs:/opt/teamcity/logs
      - ../:/repo:ro
      - ./server-bootstrap/root-project-config.xml:/data/teamcity_server/datadir/config/projects/_Root/project-config.xml
      - ./server-bootstrap/internal.properties:/data/teamcity_server/datadir/config/internal.properties
    networks:
      - control

  agent:
    image: local/teamcity-podman-agent:2026.1.3
    build:
      context: ./agent
      args:
        CONTAINER_REGISTRY: ${CONTAINER_REGISTRY:-docker.io}
        GITHUB_HOST: ${GITHUB_HOST:-github.com}
        APT_REPOSITORY: ${APT_REPOSITORY:-}
        APT_SECURITY_REPOSITORY: ${APT_SECURITY_REPOSITORY:-}
    user: "1000:1000"
    userns_mode: keep-id
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_URL: http://server:8111
      TEAMCITY_AGENT_ROOT: ${TEAMCITY_AGENT_ROOT:-/opt/teamcity-agents}
      CONTAINER_HOST: unix:///run/user/1000/podman/podman.sock
      DOCKER_HOST: unix:///run/user/1000/podman/podman.sock
    group_add:
      - "0"
    volumes:
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock
      - ../:/repo:ro
      - ${TEAMCITY_AGENT_ROOT:-/opt/teamcity-agents}:${TEAMCITY_AGENT_ROOT:-/opt/teamcity-agents}
    networks:
      - control

volumes:
  server-data:
  server-logs:

networks:
  control:
    name: teamcity-control
