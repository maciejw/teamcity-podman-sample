name: teamcity

services:
  server-config-init:
    image: ${CONTAINER_REGISTRY:-docker.io}/jetbrains/teamcity-server:2026.1.3-linux
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /config/projects/_Root/project-config.xml ]; then
          mkdir -p /config/projects/_Root
          cp /bootstrap/root-project-config.xml /config/projects/_Root/project-config.xml
        fi
    volumes:
      - ./server-bootstrap:/bootstrap:ro
      - ./server-config:/config

  server:
    image: ${CONTAINER_REGISTRY:-docker.io}/jetbrains/teamcity-server:2026.1.3-linux
    container_name: teamcity-server
    restart: unless-stopped
    depends_on:
      server-config-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8111:8111"
    volumes:
      - server-data:/data/teamcity_server/datadir
      - server-logs:/opt/teamcity/logs
      - ../:/repo:ro
      - ./server-config:/data/teamcity_server/datadir/config
    networks:
      - control

  agent:
    image: local/teamcity-podman-agent:2026.1.3
    build:
      context: ./agent
      args:
        CONTAINER_REGISTRY: ${CONTAINER_REGISTRY:-docker.io}
        GITHUB_HOST: ${GITHUB_HOST:-github.com}
    container_name: teamcity-agent
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_URL: http://server:8111
      CONTAINER_HOST: unix:///run/user/1000/podman/podman.sock
      DOCKER_HOST: unix:///run/user/1000/podman/podman.sock
    group_add:
      - "0"
    volumes:
      - agent-config:/data/teamcity_agent/conf
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock
      - /opt/buildagent/work:/opt/buildagent/work
      - /opt/buildagent/temp:/opt/buildagent/temp
      - /opt/buildagent/logs:/opt/buildagent/logs
      - /opt/buildagent/tools:/opt/buildagent/tools
      - /opt/buildagent/plugins:/opt/buildagent/plugins
      - /opt/buildagent/system:/opt/buildagent/system
      - ../:/repo:ro
    networks:
      - control

volumes:
  server-data:
  server-logs:
  agent-config:

networks:
  control:
    name: teamcity-control
