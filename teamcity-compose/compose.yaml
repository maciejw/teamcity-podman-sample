name: teamcity

services:
  server:
    image: ${CONTAINER_REGISTRY:-docker.io}/jetbrains/teamcity-server:2026.1.3-linux
    container_name: teamcity-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8111:8111"
    volumes:
      - server-data:/data/teamcity_server/datadir
      - server-logs:/opt/teamcity/logs
      - ../:/repo:ro
      - ./server-config/internal.properties:/data/teamcity_server/datadir/config/internal.properties
      - ./server-config/projects/_Root/vcsRoots:/data/teamcity_server/datadir/config/projects/_Root/vcsRoots
      - ./server-config/projects/Sample:/data/teamcity_server/datadir/config/projects/Sample
    networks:
      - control

  agent:
    image: ${CONTAINER_REGISTRY:-docker.io}/jetbrains/teamcity-agent:2026.1.3-linux
    container_name: teamcity-agent
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_URL: http://server:8111
      DOCKER_HOST: unix:///var/run/docker.sock
    group_add:
      - "0"
    volumes:
      - agent-config:/data/teamcity_agent/conf
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock
      - /opt/buildagent/work:/opt/buildagent/work
      - /opt/buildagent/temp:/opt/buildagent/temp
      - /opt/buildagent/logs:/opt/buildagent/logs
      - /opt/buildagent/tools:/opt/buildagent/tools
      - /opt/buildagent/plugins:/opt/buildagent/plugins
      - /opt/buildagent/system:/opt/buildagent/system
      - ../:/repo:ro
    networks:
      - control

volumes:
  server-data:
  server-logs:
  agent-config:

networks:
  control:
    name: teamcity-control
